name: alpine ffmpeg static

on:
  workflow_dispatch:
  push:
    branches:
      - 6.0.0
    paths:
      - '.github/workflows/alpine-ffmpeg.yml'

jobs:
  build:
    name: static ffmpeg for alpine (musl)
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.20
    permissions:
      contents: write
    steps:
      - name: install build deps
        run: apk add --no-cache build-base nasm pkgconf xz curl file
      - name: download sources
        run: |
          curl -sL https://ffmpeg.org/releases/ffmpeg-6.0.1.tar.xz | tar xJ
          curl -sL https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz | tar xz
      - name: build lame (static)
        run: |
          cd lame-3.100
          ./configure --enable-static --disable-shared --disable-frontend --disable-gtktest --prefix=/tmp/lame
          make -j"$(nproc)" && make install
      - name: configure and build
        run: |
          cd ffmpeg-6.0.1
          # Nguồn vừa giải nén, sạch config cũ; distclean phòng hờ theo spec
          make distclean 2>/dev/null || true
          export PKG_CONFIG_PATH=/tmp/lame/lib/pkgconfig
          export LDFLAGS="-L/tmp/lame/lib"
          ./configure \
            --enable-gpl --enable-libmp3lame \
            --enable-static --disable-shared --pkg-config-flags=--static \
            --disable-everything \
            --enable-demuxer=mov,mp3,matroska,ogg,pcm_s16le \
            --enable-decoder=mp3,aac,opus,vorbis,pcm_s16le \
            --enable-encoder=libmp3lame,pcm_s16le \
            --enable-muxer=mp3,pcm_s16le \
            --enable-parser=mp3,aac,opus,vorbis,mpeg4audio \
            --enable-protocol=file,pipe \
            --extra-cflags="-I/tmp/lame/include" \
            --enable-filter=anull,aresample,format,null \
            --disable-debug --enable-small --disable-doc --disable-ffprobe --disable-ffplay \
            --disable-network --disable-autodetect \
            --extra-ldflags=-static \
            --prefix=/tmp/out
          # VERIFY SAU CONFIGURE — thiếu là dừng, không make
          # (tên symbol: pcm_s16le_muxer/encoder trong pcmenc.c, không phải "s16le")
          grep -E "CONFIG_PCM_S16LE_(MUXER|ENCODER)|CONFIG_PIPE_PROTOCOL" ffbuild/config.mak
          grep -q "^CONFIG_PCM_S16LE_MUXER=yes" ffbuild/config.mak
          grep -q "^CONFIG_PCM_S16LE_ENCODER=yes" ffbuild/config.mak
          grep -q "^CONFIG_PIPE_PROTOCOL=yes" ffbuild/config.mak
          make -j"$(nproc)"
          make install
          strip /tmp/out/bin/ffmpeg
      - name: verify binary
        run: |
          FF=/tmp/out/bin/ffmpeg
          $FF -hide_banner -version
          echo "-- muxers";   $FF -hide_banner -muxers   2>/dev/null | grep -E " E s16le"
          echo "-- encoders"; $FF -hide_banner -encoders 2>/dev/null | grep -E "pcm_s16le|libmp3lame"
          echo "-- demuxers"; $FF -hide_banner -demuxers 2>/dev/null | grep -E "mov|mp3|ogg|matroska"
          echo "-- static check"
          file "$FF"
          # ldd của musl với binary static: "Not a valid dynamic program"
          ldd "$FF" 2>&1 || true
          file "$FF" | grep -qE "statically linked|static-pie linked"
          ldd "$FF" 2>&1 | grep -qiE "not a dynamic executable|not a valid dynamic program"
      - name: functional test (pcm s16le ra đúng số byte)
        run: |
          FF=/tmp/out/bin/ffmpeg
          # không có lavfi (đã --disable-everything) → tạo PCM 2s giả lập rồi round-trip qua mp3
          head -c 32000 /dev/urandom > in.pcm   # 2s × 8000Hz × 2 bytes, mono
          $FF -hide_banner -loglevel error -f s16le -ar 8000 -ac 1 -i in.pcm -c:a libmp3lame -b:a 64k test.mp3
          N=$($FF -hide_banner -loglevel error -i test.mp3 -vn -ac 1 -ar 8000 \
                -c:a pcm_s16le -f s16le pipe:1 | wc -c)
          echo "PCM out: $N bytes (kỳ vọng ~32000, dung sai do frame padding mp3)"
          [ "$N" -ge 30000 ] && [ "$N" -le 34000 ]
      - name: package
        run: |
          tar -C /tmp/out/bin -czf ffmpeg-alpine-musl-static.tar.gz ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-alpine-musl-static
          path: ffmpeg-alpine-musl-static.tar.gz
      - name: upload to latest aar release (nếu có), không thì tự tạo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache github-cli
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                  --json tagName -q '.[].tagName' | grep '^v6.0.0-custom' | head -1)
          if [ -n "$TAG" ]; then
            echo "Uploading vào release $TAG"
            gh release upload "$TAG" ffmpeg-alpine-musl-static.tar.gz --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            TAG="ffmpeg-alpine-6.0.1.${{ github.run_number }}"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "ffmpeg 6.0.1 static cho Alpine/musl. GPL (libmp3lame). Chỉ audio: m4a/aac, webm/opus, vorbis, mp3 → mp3, pcm s16le (waveform)." \
              ffmpeg-alpine-musl-static.tar.gz
          fi
