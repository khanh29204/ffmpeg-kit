name: android custom aar

on:
  push:
    branches:
      - 6.0.0
    paths:
      - '.github/workflows/custom-android-aar.yml'
      - 'android.sh'
      - 'scripts/**'
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    name: custom gpl aar on linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: cache build tree
        uses: actions/cache@v4
        with:
          # sources đã tải + các thư viện native đã build; android.sh tự skip phần đã có
          path: |
            src
            prebuilt
          key: ffkit-${{ runner.os }}-${{ hashFiles('scripts/**', 'android.sh', '.github/workflows/custom-android-aar.yml') }}
      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y gperf texi2html nasm
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --uninstall "cmake;3.10.2.4988404" "cmake;3.18.1"
      - name: set up android ndk r27
        run: |
          curl -s "https://dl.google.com/android/repository/android-ndk-r27b-linux.zip" -o ndk.zip
          unzip -q -o ndk.zip -d .ndk
          echo "ANDROID_NDK_ROOT=$PWD/.ndk/$(ls .ndk)" >> $GITHUB_ENV
      - name: run the build script
        env:
          FFMPEG_KIT_TRIM: 1
        run: ./android.sh --enable-gpl --enable-x264 --enable-lame --enable-libwebp --enable-android-zlib --enable-android-media-codec --disable-arm-v7a --disable-x86
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
      - name: print ffbuild logs
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -50 ./src/ffmpeg/ffbuild/config.log'
      - name: verify 16 kb page alignment
        if: ${{ always() }}
        run: |
          for so in $(find prebuilt/android-* -name "*.so"); do
            echo "== $so"
            objdump -p "$so" | grep LOAD
          done
      - name: upload aar
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-custom-gpl
          path: prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v6.0.0-custom.${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "ffmpeg-kit custom GPL build (x264, lame, webp, mediacodec h264; ABI: armeabi-v7a-neon, arm64-v8a, x86_64). GPLv3.0." \
            prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar
